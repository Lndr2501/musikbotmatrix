name: musikbot

services:
  musikbot:
    build: .
    image: musikbotmatrix:latest
    # WebRTC braucht volle UDP-Freiheit (aiortc hat keine konfigurierbaren
    # Portbereiche). Host-Network ist der einfachste Weg; alternativ TURN nutzen.
    network_mode: host
    restart: unless-stopped
    env_file: .env
    volumes:
      # Docker-Volume (kein Bind-Mount): ueberlebt Neustarts und "compose down",
      # wird aber mit "compose down -v" bzw. "Delete + Remove volumes" in der UI
      # zuverlaessig mit geloescht – es liegen keine Dateien im Projektordner.
      - data:/data
      # Radio-Ordner: MP3s hier reinlegen oder im Dashboard hochladen (Bot legt nur neue
      # Dateien an, loescht/ueberschreibt nie). Host-Ordner muss fuer UID 10000 beschreibbar sein.
      - ./radio:/radio

  # Eigene Spracherkennung fuers Ohr (OHR_ENABLED=true, STT_URL=http://127.0.0.1:8097/v1).
  # Start mit: docker compose --profile ohr up -d
  stt:
    image: musikbotmatrix:latest
    profiles: ["ohr"]
    entrypoint: ["python", "-m", "musikbot.stt_server"]
    network_mode: host                # lauscht nur auf 127.0.0.1:8097
    restart: unless-stopped
    environment:
      STT_LOCAL_MODEL: small          # small: ~2 s pro Satz, 0,8 GB; large-v3-turbo: ~8 s, 1,8 GB
      STT_THREADS: "4"
    volumes:
      - data:/data                    # Modell landet in /data/stt-models (einmaliger Download)
    cpus: 4
    mem_limit: 1536m

volumes:
  data:
