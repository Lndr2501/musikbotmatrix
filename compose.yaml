name: musikbot

services:
  musikbot:
    build: .
    image: musikbotmatrix:latest
    # WebRTC braucht volle UDP-Freiheit (aiortc hat keine konfigurierbaren
    # Portbereiche). Host-Network ist der einfachste Weg; alternativ TURN nutzen.
    network_mode: host
    restart: unless-stopped
    env_file: .env
    volumes:
      # Docker-Volume (kein Bind-Mount): ueberlebt Neustarts und "compose down",
      # wird aber mit "compose down -v" bzw. "Delete + Remove volumes" in der UI
      # zuverlaessig mit geloescht – es liegen keine Dateien im Projektordner.
      - data:/data
      # Radio-Ordner: MP3s hier reinlegen (read-only fuer den Bot), dann !24/7 radio
      - ./radio:/radio:ro

volumes:
  data:
