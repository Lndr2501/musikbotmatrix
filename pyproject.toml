[project]
name = "musikbotmatrix"
version = "0.2.0"
description = "Matrix-Musikbot: spielt YouTube-Titel in klassischen Matrix-Calls ab"
requires-python = ">=3.11"
dependencies = [
    # Bot-Library (Matrix, E2EE, diddy.git@main-Karten); nach dem Merge von Diddy-PR #230 auf @main stellen.
    "diddy-bot @ git+https://github.com/Lndr2501/diddy.git@main#subdirectory=sdk/python",
    "aiortc>=1.15,<2",
    "av>=16,<18",
    "numpy>=1.26",
    "yt-dlp[default,curl-cffi]>=2025.1.1",
    "aiohttp>=3.9",
    "livekit>=1.0,<2",
    "pillow>=10.1",
    "piper-tts>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# Eigene Spracherkennung fuers Ohr (python -m musikbot.stt_server), CPU reicht
stt = ["faster-whisper>=1.1,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["musikbot*"]

[tool.setuptools.package-data]
musikbot = ["static/*", "baer_assets/*", "baer_assets/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
